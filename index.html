  .game { max-width: 860px; height: 100vh; max-height: 760px; margin: 0 auto; display: flex; flex-direction: column;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--white); }
  /* top bar */
  .topbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 10px 14px; background: var(--dark); color: var(--white); flex: 0 0 auto; }
  .topbar .title { font-family: var(--pixel); font-weight: 400; font-size: 17px; line-height: 1.5; letter-spacing: .5px; flex: 1 1 auto; }
  .topbar .controls { display: flex; align-items: center; gap: 10px; }
  .topbar .title span { color: var(--yellow); }
  .topbar .count { font-size: 15px; color: #C7C9CC; white-space: nowrap; }
  button { font-family: inherit; font-size: 16px; cursor: pointer; border-radius: 6px; }
  button:focus-visible { outline: 3px solid var(--dark); outline-offset: 2px; }
  .on-dark button:focus-visible, .topbar button:focus-visible, .dialog button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .btn-ghost { background: transparent; color: var(--white); border: 1px solid #5A5D63; padding: 6px 12px; font-size: 15px; min-height: 36px; }
  .btn-ghost[aria-pressed="false"] { color: #C7C9CC; }
  .btn-ghost:hover { border-color: var(--yellow); color: var(--yellow); }
  .btn-main { background: var(--yellow); color: var(--dark); border: 2px solid var(--yellow); padding: 10px 20px; min-height: 48px; font-size: 17px; font-weight: 700; }
  .btn-main:hover { background: var(--white); border-color: var(--white); }
  .btn-alt { background: transparent; color: var(--white); border: 2px solid #5A5D63; padding: 10px 20px; min-height: 48px; font-size: 17px; font-weight: 600; }
  .btn-alt:hover { border-color: var(--white); }
  /* stage */
  .stage { position: relative; flex: 0 0 auto; height: 268px; overflow: hidden; transition: background-color .4s; background-size: cover; background-position: center; }
  .stage .floor { position: absolute; left: 0; right: 0; bottom: 44px; height: 3px; background: var(--yellow); opacity: .9; }
  .banner { position: absolute; top: 12px; left: 14px; z-index: 2; background: var(--dark); color: var(--yellow); font-family: var(--pixel); font-size: 12px; font-weight: 400; line-height: 1.7;
    padding: 7px 12px; border-radius: 4px; max-width: calc(100% - 28px); }
  .banner small { color: #C7C9CC; font-family: "Plus Jakarta Sans", Arial, sans-serif; font-weight: 600; margin-left: 8px; font-size: 14px; }
  .player { position: absolute; bottom: 30px; left: 9%; width: 168px; height: 168px; background-repeat: no-repeat;
    image-rendering: pixelated; image-rendering: crisp-edges; }
  .player.flash { animation: flash .2s steps(1) 2; }
  @keyframes flash { 50% { filter: brightness(3) saturate(0); } }
  .stage.fade { animation: fade .5s ease; }
  @keyframes fade { 0% { opacity: 1; } 45% { opacity: 0; } 100% { opacity: 1; } }
  .placeholder { position: absolute; bottom: 44px; left: 9%; width: 160px; height: 160px; border: 2px dashed var(--white);
    color: var(--white); display: none; align-items: center; justify-content: center; text-align: center; font-weight: 700; padding: 10px; }
  .bigmentor { position: absolute; bottom: 30px; right: 10%; width: 180px; height: 180px; display: none; background-repeat: no-repeat;
    image-rendering: pixelated; }
  .track { position: absolute; left: 14px; right: 14px; bottom: 10px; display: flex; gap: 6px; }
  .track span { flex: 1; height: 10px; border-radius: 3px; background: rgba(255,255,255,.35); border: 1px solid rgba(18,20,23,.5); }
  .track span.done { background: var(--yellow); }
  .track span.now { background: var(--white); }
  .evolve { position: absolute; right: 14px; top: 60px; max-width: 46%; z-index: 2; background: rgba(18,20,23,.88); color: var(--white);
    padding: 8px 12px; border-radius: 6px; font-size: 16px; font-weight: 600; display: none; }
  /* dialogue */
  .dialog { position: relative; flex: 1 1 auto; min-height: 0; display: flex; gap: 14px; padding: 14px 14px 56px 14px; background: var(--dark); color: var(--white); }
  .logo { position: absolute; right: 14px; bottom: 12px; height: 34px; width: auto; pointer-events: none; }
  .portrait { flex: 0 0 150px; width: 150px; height: 150px; background-repeat: no-repeat; image-rendering: pixelated;
    border-radius: 8px; background-color: #26282B; align-self: flex-start; }
  .portrait.bob { animation: bob .4s steps(2) infinite; }
  @keyframes bob { 50% { transform: translateY(-2px); } }
  .talk { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding-right: 4px; }
  .speaker { color: var(--yellow); font-family: var(--pixel); font-weight: 400; font-size: 11px; line-height: 1.8; letter-spacing: .3px; margin: 0 0 8px 0; }
  .text { margin: 0 0 12px 0; font-size: 18px; line-height: 1.55; }
  .text strong { color: var(--yellow); }
  .options { display: grid; gap: 8px; margin: 0 0 10px 0; }
  .opt { text-align: left; background: #26282B; color: var(--white); border: 2px solid #3A3D42; padding: 10px 12px; min-height: 48px; font-size: 17px; line-height: 1.45; display: flex; gap: 10px; align-items: flex-start; }
  .opt:hover:not(:disabled) { border-color: var(--yellow); }
  .opt .mark { flex: 0 0 26px; height: 26px; border-radius: 50%; border: 2px solid #5A5D63; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
  .opt.wrong { border-color: var(--red); opacity: .75; cursor: default; }
  .opt.wrong .mark { border-color: var(--red); color: #FF8A80; }
  .opt.right { background: var(--pale); color: var(--dark); border-color: var(--yellow); }
  .opt.right .mark { background: var(--dark); color: var(--yellow); border-color: var(--dark); }
  .opt .tag { font-size: 14px; font-weight: 700; margin-left: auto; padding-left: 8px; white-space: nowrap; }
  .feedback { background: #26282B; border-left: 4px solid var(--yellow); padding: 10px 14px; border-radius: 6px; margin: 0 0 10px 0; font-size: 17px; }
  .feedback.hint { border-left-color: #C7C9CC; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .review { list-style: none; padding: 0; margin: 0 0 12px 0; }
  .review li { background: #26282B; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; font-size: 16px; }
  .review b { color: var(--yellow); }
  /* modal */
  .modal { position: fixed; inset: 0; background: rgba(18,20,23,.6); display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal.open { display: flex; }
  .modal .box { background: var(--white); color: var(--dark); border-radius: 10px; padding: 20px; max-width: 340px; width: 100%; }
  .modal .box p { margin: 0 0 14px 0; font-weight: 600; }
  .modal .btn-alt { color: var(--dark); border-color: var(--line); }
  .modal .btn-main { border-color: var(--dark); background: var(--dark); color: var(--yellow); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 560px) {
    .topbar .title { font-size: 13px; flex-basis: 100%; }
    .topbar .controls { width: 100%; justify-content: flex-end; }
    .topbar .count { margin-right: auto; }
    .stage { height: 222px; }
    .banner { font-size: 10px; padding: 6px 10px; }
    .banner small { display: block; margin-left: 0; font-size: 13px; }
    .player { width: 112px; height: 112px; bottom: 34px; left: 6%; }
    .stage .floor { bottom: 38px; }
    .portrait { flex-basis: 75px; width: 75px; height: 75px; }
    .bigmentor { width: 120px; height: 120px; right: 6%; bottom: 34px; }
    .evolve { max-width: 55%; top: auto; right: 14px; bottom: 52px; font-size: 15px; }
    .dialog { gap: 10px; padding: 12px 12px 48px 12px; }
    .logo { height: 28px; right: 12px; bottom: 10px; }
    .speaker { font-size: 10px; }
    .text { font-size: 18px; }
    .opt, .feedback { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .player.flash, .stage.fade, .portrait.bob { animation: none; }
    .stage { transition: none; }
  }
</style>
</head>

  var DATA = {"eras": [{"id": 1, "name": "The First Record Keeper", "year": "About 8000 BCE", "intro": "Long before writing, people tracked goods with small clay tokens. One token, one sheep. Records started here."}, {"id": 2, "name": "The Scribe", "year": "About 3000 BCE", "intro": "Scribes pressed records into clay tablets. Someone recorded the facts, and someone else used them to decide."}, {"id": 3, "name": "The Merchant", "year": "Venice, 1490s", "intro": "In 1494, Luca Pacioli published the method merchants already trusted: double-entry bookkeeping. Every entry has two sides."}, {"id": 4, "name": "The Ledger Clerk", "year": "1800s", "intro": "Counting houses kept rows of heavy ledgers. Each entry was copied from the journal to its account, then checked."}, {"id": 5, "name": "The Office Accountant", "year": "1990s", "intro": "Spreadsheets sped up the work, but the accounting cycle stayed the same, step by step, every period."}, {"id": 6, "name": "The Modern Accountant", "year": "Today", "intro": "AI now drafts and checks much of the routine work. The accountant's judgment still decides what is right."}], "questions": [{"era": 1, "q": "A business has assets of $80,000 and liabilities of $30,000. What is its equity?", "options": [{"t": "$50,000", "correct": true}, {"t": "$110,000"}, {"t": "$30,000"}, {"t": "$80,000"}], "hint": "Start from Assets = Liabilities + Equity. What is left for the owners after the liabilities?", "explain": "Equity = Assets − Liabilities = $80,000 − $30,000 = $50,000."}, {"era": 1, "q": "A company with $50,000 in assets buys $8,000 of equipment with cash. What happens to total assets?", "options": [{"t": "They stay at $50,000: cash falls by $8,000 and equipment rises by $8,000.", "correct": true}, {"t": "They rise to $58,000."}, {"t": "They fall to $42,000."}, {"t": "Liabilities rise by $8,000 to keep the equation balanced."}], "hint": "Both accounts in this transaction are assets. One goes up and one goes down.", "explain": "One asset is exchanged for another, so total assets do not change and the equation still balances."}, {"era": 1, "q": "A business borrows $10,000 from a bank. What happens to the accounting equation?", "options": [{"t": "Assets increase by $10,000 and liabilities increase by $10,000.", "correct": true}, {"t": "Assets increase by $10,000 and equity increases by $10,000."}, {"t": "Nothing changes until the loan is repaid."}, {"t": "Liabilities increase by $10,000 and equity decreases by $10,000."}], "hint": "The cash arrives now, and the business must repay it later. Which side records what the business owes?", "explain": "Cash (an asset) and the loan payable (a liability) both increase by $10,000, so both sides of the equation rise by the same amount."}, {"era": 2, "q": "Which task is bookkeeping rather than accounting?", "options": [{"t": "Recording each day's invoices, payments, and expenses.", "correct": true}, {"t": "Interpreting the financial statements to advise management."}, {"t": "Analyzing trends to support a pricing decision."}, {"t": "Planning the company's long-term financing."}], "hint": "Think of the nurse who records the chart, not the doctor who reads it.", "explain": "Bookkeepers record and organize day-to-day transactions. Accountants interpret that information and advise on decisions."}, {"era": 2, "q": "MOO's $150 petty cash box holds $122.87 in cash and $27.13 in receipts. Which entry replenishes the fund?", "options": [{"t": "Debit the expense accounts $27.13 in total, credit Cash $27.13.", "correct": true}, {"t": "Debit Petty Cash $27.13, credit Cash $27.13."}, {"t": "Debit the expense accounts $27.13, credit Petty Cash $27.13."}, {"t": "No entry until the box is empty."}], "hint": "The receipts are expenses that have not been recorded yet. Where does the money to refill the box come from?", "explain": "The receipts become expenses, and cash from the bank account refills the box. The fund stays at $150."}, {"era": 2, "q": "Which work usually requires a professional license, such as a CPA, ACCA, or Chartered Accountant qualification?", "options": [{"t": "Signing an audit report on a company's financial statements", "correct": true}, {"t": "Recording each day's sales and payments"}, {"t": "Managing supplier invoices"}, {"t": "Entering receipts into accounting software"}], "hint": "Think about the independent check that investors and lenders rely on.", "explain": "Public accounting and audit require a professional license in most countries. For bookkeeping and many in-house roles, employers decide what to require."}, {"era": 3, "q": "Which group of accounts increases with a debit?", "options": [{"t": "Assets, expenses, and dividends", "correct": true}, {"t": "Liabilities, equity, and revenue"}, {"t": "Assets and revenue"}, {"t": "Only the Cash account"}], "hint": "Debits increase the accounts on the left side of the accounting equation, plus the accounts that reduce equity.", "explain": "Debits increase assets, expenses, and dividends. Credits increase liabilities, equity, and revenue."}, {"era": 3, "q": "A business buys equipment on credit for $2,000. Which entry is correct?", "options": [{"t": "Debit Equipment $2,000, credit Accounts Payable $2,000.", "correct": true}, {"t": "Debit Equipment $2,000, credit Cash $2,000."}, {"t": "Debit Accounts Payable $2,000, credit Equipment $2,000."}, {"t": "Debit Equipment Expense $2,000, credit Accounts Payable $2,000."}], "hint": "No cash has changed hands yet. What does the business now owe?", "explain": "An asset (equipment) and a liability (accounts payable) both increase by $2,000."}, {"era": 3, "q": "The owner invests $10,000 of personal cash in the business. Which entry records it?", "options": [{"t": "Debit Cash $10,000, credit Owner's Equity $10,000.", "correct": true}, {"t": "Debit Owner's Equity $10,000, credit Cash $10,000."}, {"t": "Debit Cash $10,000, credit Revenue $10,000."}, {"t": "Debit Cash $10,000, credit Loan Payable $10,000."}], "hint": "The business did not earn this money and does not have to repay it. Whose claim increases?", "explain": "Cash (an asset) increases, and so does the owner's claim on the business (equity). An owner's investment is not revenue."}, {"era": 4, "q": "Where is a transaction recorded first?", "options": [{"t": "In the journal, the book of original entry", "correct": true}, {"t": "In the general ledger"}, {"t": "In the trial balance"}, {"t": "In the financial statements"}], "hint": "Entries are posted from this record to the ledger.", "explain": "Each transaction is recorded first in the journal, in date order, then posted to the accounts in the general ledger."}, {"era": 4, "q": "A trial balance shows total debits of $48,200 and total credits of $47,700. What does that tell you?", "options": [{"t": "There is at least one error to find and correct.", "correct": true}, {"t": "The business made a profit of $500."}, {"t": "The books are correct; small differences are normal."}, {"t": "Credits should be increased by $500 to match."}], "hint": "In double-entry bookkeeping, what must be true of the two totals?", "explain": "Total debits must equal total credits. A difference means an amount was posted to one side only, posted twice, or listed on the wrong side."}, {"era": 4, "q": "Who should record the receipt of cash from customers?", "options": [{"t": "Someone other than the person who handles the cash", "correct": true}, {"t": "The same person who handles the cash, for efficiency"}], "hint": "If one person both handles and records cash, who would notice a missing amount?", "explain": "Separating who handles cash from who records it is a basic internal control called segregation of duties. It helps prevent and detect fraud."}, {"era": 5, "q": "An error is discovered after a transaction was recorded. How is it fixed?", "options": [{"t": "A correcting journal entry is made to adjust the mistake.", "correct": true}, {"t": "The original entry is erased and rewritten correctly."}], "hint": "Good records keep a trail of every change.", "explain": "A correcting entry fixes the error and keeps a record of what changed. Erasing entries removes the audit trail."}, {"era": 5, "q": "Who is ultimately responsible for the accuracy of the financial records and statements?", "options": [{"t": "The company's management and executives", "correct": true}, {"t": "The bookkeeper"}, {"t": "The external auditor"}, {"t": "The accounting software provider"}], "hint": "Others prepare and check the records. Who oversees the business and signs off?", "explain": "Bookkeepers record and auditors check, but final responsibility lies with management and executives."}, {"era": 5, "q": "Employees work the last week of December but are paid in January. When is the salary expense recorded?", "options": [{"t": "In December, with a salaries payable liability", "correct": true}, {"t": "In January, when the cash is paid"}, {"t": "Half in December and half in January"}], "hint": "Under accrual accounting, expenses follow the work, not the cash.", "explain": "The expense belongs to the period when the work was done. In December: debit Salaries Expense, credit Salaries Payable. In January: debit Salaries Payable, credit Cash."}, {"era": 6, "q": "An AI tool drafts a statement of financial position from the ledger data. What should happen next?", "options": [{"t": "An accountant reviews it against the records, because management remains responsible for the statements.", "correct": true}, {"t": "It can be published as is, because AI is accurate."}, {"t": "The AI provider becomes responsible for any errors."}, {"t": "The trial balance step can be skipped from now on."}], "hint": "AI speeds up the work. Who still signs off?", "explain": "AI can draft statements quickly, but accountants check the output and management remains responsible for what is reported."}, {"era": 6, "q": "Which use of AI follows NXU's guidelines for this course?", "options": [{"t": "Asking AI to explain a concept, checking the explanation against the course, and declaring the use on the AI Disclosure Form", "correct": true}, {"t": "Pasting the assignment instructions into AI and submitting its answer"}, {"t": "Using AI without declaring it, as long as the answer is correct"}, {"t": "Copying AI-generated figures into the assignment without checking them"}], "hint": "AI is encouraged when it supports your own thinking and you declare it.", "explain": "AI tools are encouraged for understanding and support. Your submission must show your own thinking, figures must be checked, and every AI use is declared on the AI Disclosure Form."}, {"era": 6, "q": "What does AI-driven fraud detection do in an accounting system?", "options": [{"t": "It flags unusual spending patterns and suspicious transactions for people to review.", "correct": true}, {"t": "It approves every payment automatically, so no review is needed."}, {"t": "It replaces the external audit."}, {"t": "It decides which transactions the business records."}], "hint": "AI finds patterns in large amounts of data. Who acts on what it finds?", "explain": "AI tools spot unusual patterns quickly and flag them. People then investigate, and management stays responsible for the records."}]};

  var frame = 0, seq = [0, 1, 2, 1];
  function drawPlayer() {

      ev.textContent = EVOLVE[era]; ev.style.display = "block";
      announce(EVOLVE[era]);
      setTimeout(function () { ev.style.display = "none"; }, reduced ? 2500 : 2200);
      eraIntro(era);
    };
    Sound.sfx("evolve");
    if (reduced) return after();
    player.classList.add("flash");
    setTimeout(function () {
      player.classList.remove("flash");
      stage.classList.remove("fade"); void stage.offsetWidth; stage.classList.add("fade");
      setTimeout(after, 230);
    }, 420);
  }
  function finale() {
    stage.classList.add("finale");
    state.screen = "finale"; state.era = 7; setCount();
    stopAnim(); drawStage();
    // keep the era 6 player on stage
    var keep = state.era; state.era = 6; drawPlayer(); state.era = keep;
    setBigMentor(true); setPortrait("celebrate"); Sound.sfx("finale");
    var n = state.firstTry, total = DATA.questions.length, msg;
    if (n >= 16) msg = "You know these foundations well. You're ready for the Module 1 assignment.";
    else if (n >= 11) msg = "Solid work. Review the questions you missed on the first try before the assignment.";
    else msg = "Revisit Sections 2 to 4, then play again. Each attempt makes the next one easier.";
    content.innerHTML = "";
    var p = el("p", "text"); content.appendChild(p);
    var sum = el("div", "feedback", "<strong>First-try answers: " + n + " of " + total + ".</strong> " + esc(msg));
    var actions = el("div", "actions");
    var again = button("Play again", "btn-main", function () { title(); });
    var rev = button("Review the questions", "btn-alt", function () { review(); });
    actions.appendChild(again); actions.appendChild(rev);
    announce("Game complete. First-try answers: " + n + " of " + total + ".");
    typeInto(p, esc(LINES.finale), function () { content.appendChild(sum); content.appendChild(actions); again.focus(); });
  }
  function review() {
    state.screen = "review";
    setPortrait("neutral");
    content.innerHTML = "<p class='text'><strong>All " + DATA.questions.length + " questions, with the answers.</strong></p>";
    var ul = el("ul", "review");
    DATA.questions.forEach(function (Q, i) {
      var ans = Q.options.filter(function (o) { return o.correct; })[0].t;
      var missed = state.missed.indexOf(i) >= 0 ? " <span style='color:#FF8A80;font-weight:700'>(missed on the first try)</span>" : "";
      ul.appendChild(el("li", "", "<b>" + (i + 1) + ". " + esc(Q.q) + "</b>" + missed + "<br>Answer: " + esc(ans) + "<br><span style='color:#C7C9CC'>" + esc(Q.explain) + "</span>"));
    });
    content.appendChild(ul);
    var actions = el("div", "actions");
    var again = button("Play again", "btn-main", function () { title(); });
    actions.appendChild(again); content.appendChild(actions);
    $("talk").scrollTop = 0; content.querySelector(".text").setAttribute("tabindex", "-1"); content.querySelector(".text").focus();
  }

  // ---------- retro sound (original chiptune, generated in the browser) ----------
  var Sound = (function () {
    var ctx = null, master = null, musicGain = null, sfxGain = null, timer = null, step = 0, nextTime = 0, playing = false;
    var on = true;
    try { if (localStorage.getItem("ledgerSound") === "off") on = false; } catch (e) {}
    var BPM = 132, EIGHTH = 60 / BPM / 2;
    // melody in MIDI note numbers, one value per eighth note (0 = rest). 8 bars, chords C - Am - F - G twice.
    var MEL = [72,76,79,76,72,76,79,84, 81,79,76,72,74,76,72,69, 77,81,84,81,77,76,74,72, 74,79,83,79,77,76,74,71,
               79,0,79,81,79,76,72,74, 76,0,72,69,72,76,79,0, 77,77,76,74,72,74,76,77, 79,0,74,0,71,74,79,0];
    var BASS = [48,55,48,55, 45,52,45,52, 41,48,41,48, 43,50,43,50];  // quarter notes, one bar = 4
    function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
    function init() {
      if (ctx) return true;
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = 1; master.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = 0.06; musicGain.connect(master);
      sfxGain = ctx.createGain(); sfxGain.gain.value = 0.12; sfxGain.connect(master);
      return true;
    }
    function tone(type, freq, t, dur, gainNode, vol) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(gainNode); o.start(t); o.stop(t + dur + 0.02);
    }
    function hat(t) {
      var len = Math.floor(ctx.sampleRate * 0.03), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = ctx.createBufferSource(), g = ctx.createGain(); g.gain.value = 0.35; src.buffer = buf; src.connect(g); g.connect(musicGain); src.start(t);
    }
    function schedule() {
      while (nextTime < ctx.currentTime + 0.12) {
        var m = MEL[step % MEL.length];
        if (m) tone("square", hz(m), nextTime, EIGHTH * 0.9, musicGain, 0.5);
        if (step % 2 === 0) tone("triangle", hz(BASS[(step / 2) % BASS.length]), nextTime, EIGHTH * 1.8, musicGain, 0.9);
        if (step % 2 === 1) hat(nextTime);
        nextTime += EIGHTH; step++;
      }
    }
    function startMusic() {
      if (!on || playing || !init()) return;
      if (ctx.state === "suspended") ctx.resume();
      playing = true; step = 0; nextTime = ctx.currentTime + 0.05;
      timer = setInterval(schedule, 25);
    }
    function stopMusic() { playing = false; if (timer) { clearInterval(timer); timer = null; } }
    function sfx(kind) {
      if (!on || !init()) return;
      if (ctx.state === "suspended") ctx.resume();
      var t = ctx.currentTime + 0.01, seq;
      if (kind === "correct") seq = [[72,.07],[76,.07],[79,.07],[84,.16]];
      else if (kind === "hint") seq = [[67,.1],[64,.16]];
      else if (kind === "reveal") seq = [[64,.1],[67,.1],[72,.18]];
      else if (kind === "evolve") seq = [[60,.06],[64,.06],[67,.06],[72,.06],[76,.06],[79,.06],[84,.2]];
      else if (kind === "finale") seq = [[72,.12],[72,.12],[72,.12],[79,.3],[76,.12],[79,.12],[84,.45]];
      else return;
      seq.forEach(function (n) { tone("square", hz(n[0]), t, n[1] * 0.95, sfxGain, 0.6); t += n[1]; });
    }
    function setOn(v) {
      on = v; try { localStorage.setItem("ledgerSound", v ? "on" : "off"); } catch (e) {}
      if (!v) stopMusic(); else if (started) startMusic();
    }
    var started = false;
    document.addEventListener("visibilitychange", function () {
      if (!ctx) return;
      if (document.hidden) ctx.suspend(); else if (on) ctx.resume();
    });
    return { start: function () { started = true; startMusic(); }, stop: stopMusic, sfx: sfx, setOn: setOn, isOn: function () { return on; } };
  })();
  var soundBtn = $("soundBtn");
  function paintSound() { var v = Sound.isOn(); soundBtn.textContent = "Sound: " + (v ? "On" : "Off"); soundBtn.setAttribute("aria-pressed", v ? "true" : "false"); }
  soundBtn.addEventListener("click", function () { Sound.setOn(!Sound.isOn()); paintSound(); });
  paintSound();

  // ---------- restart ----------
  var modal = $("modal"), lastFocus = null;
  $("restartBtn").addEventListener("click", function () { lastFocus = document.activeElement; modal.classList.add("open"); $("modalNo").focus(); });
  $("modalNo").addEventListener("click", function () { modal.classList.remove("open"); if (lastFocus) lastFocus.focus(); });
  $("modalYes").addEventListener("click", function () { modal.classList.remove("open"); title(); });
  modal.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { $("modalNo").click(); }
    if (ev.key === "Tab") { var a = $("modalYes"), b = $("modalNo"); if (ev.shiftKey && document.activeElement === a) { ev.preventDefault(); b.focus(); } else if (!ev.shiftKey && document.activeElement === b) { ev.preventDefault(); a.focus(); } }
  });
  window.addEventListener("resize", refreshVisuals);
  title();
  window.__game = { get state() { return state; }, data: DATA };
})();
</script>
